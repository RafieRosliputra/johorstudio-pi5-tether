name: Build Pi 5 image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "pi/**"
      - "image/**"
      - ".github/workflows/build-image.yml"

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build image (Raspberry Pi OS Lite 64-bit + JohorStudio Tether)
        id: build
        uses: pguyot/arm-runner-action@v2
        with:
          base_image: raspios_lite_arm64:latest
          image_additional_mb: 1536
          cpu: cortex-a53
          copy_repository_path: /opt/jstether-src
          commands: bash /opt/jstether-src/image/customize.sh

      - name: Compress
        run: |
          NAME=johorstudio-tether-pi5-$(date -u +%Y%m%d)
          sudo mv "${{ steps.build.outputs.image }}" "$NAME.img"
          sudo xz -T0 -6 -v "$NAME.img"
          sudo chown "$USER" "$NAME.img.xz"
          sha256sum "$NAME.img.xz" > "$NAME.img.xz.sha256"
          echo "NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}.img.xz
            ${{ env.NAME }}.img.xz.sha256
          compression-level: 0

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('image-{0}', github.run_number) }}
          name: Pi 5 image ${{ env.NAME }}
          files: |
            ${{ env.NAME }}.img.xz
            ${{ env.NAME }}.img.xz.sha256
          body: |
            Flash `${{ env.NAME }}.img.xz` with Raspberry Pi Imager → "Use custom".
            Choose **NO** when Imager asks to apply OS customisation.
            Then edit `jstether.txt` on the `bootfs` drive (WiFi, password).
